name: CDK synth

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synth:
    name: Synth ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install AWS CDK CLI
        run: npm install --global aws-cdk

      - name: Synchronize dependencies
        run: uv sync --frozen --dev

      - name: Synthesize stack
        working-directory: cdk
        run: uv run cdk synth --context environment=${{ matrix.environment }}
