name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - run: echo ok

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Synchronize dependencies
        run: uv sync --locked --dev --all-packages

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Synchronize dependencies
        run: uv sync --locked --dev --all-packages

      - name: Run tests
        run: uv run pytest

  status-check:
    name: status-check
    runs-on: ubuntu-latest
    needs: [guard, lint, test]
    steps:
      - run: echo ok
