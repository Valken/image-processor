name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # One deploy per environment at a time; queue rather than cancel, so a
    # deploy is never interrupted mid-way through a CloudFormation update.
    concurrency:
      group: deploy-${{ github.event_name == 'release' && 'dev' || inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.event_name == 'release' && 'dev' || inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install AWS CDK CLI
        run: npm install --global aws-cdk@2.1146.1

      - name: Synchronize dependencies
        run: uv sync --locked --dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Deploy stack
        working-directory: cdk
        run: uv run cdk deploy --context environment=${{ env.DEPLOY_ENV }} --all --require-approval never
