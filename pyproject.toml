[project]
name = "image-processor"
version = "0.2.1"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["handlers/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CDK tests import stack modules the way cdk/app.py does.
pythonpath = ["cdk"]
# importlib mode: test dirs need no __init__.py, and files in different dirs can share a name.
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.265.0",
    "constructs>=10.8.1",
    "pre-commit>=4.6.1",
    "pytest>=8.3.0",
    "ruff>=0.11.10",
]
