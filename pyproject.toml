[project]
name = "image-processor"
version = "0.2.3"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
# One uv version everywhere: setup-uv in CI reads this, and the bundling image
# (cdk/bundling/Dockerfile) and handlers' uv_build range must match it.
required-version = ">=0.13.10,<0.14"

[tool.uv.workspace]
members = ["handlers/*", "libs/*"]

[tool.ruff]
# First-party code: CDK modules are imported top-level (as cdk/app.py does),
# and each workspace member is its own package root.
src = [".", "cdk", "handlers/*", "libs/*"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CDK tests import stack modules the way cdk/app.py does.
pythonpath = ["cdk"]
# importlib mode: test dirs need no __init__.py, and files in different dirs can share a name.
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.265.0",
    "constructs>=10.8.1",
    "pre-commit>=4.6.1",
    "pytest>=8.3.0",
    "ruff>=0.11.10",
]
